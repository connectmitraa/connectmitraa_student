server.port=8080

# Spring Application Name
spring.application.name=studyloop-backend

# Local H2 Database Configuration (zero-setup local development)
spring.datasource.url=jdbc:h2:mem:studyloopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret & Expiration Configuration
app.jwt.secret=studyloop_super_secret_secure_key_for_jwt_tokens_2026_spring_boot_3_peer_learning
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.studyloop=INFO
logging.level.org.springframework.web.socket=INFO
