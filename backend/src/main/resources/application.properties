server.port=8080

# Spring Application Name
spring.application.name=studyloop-backend

# 1. Java 21 Virtual Threads (Project Loom - Massive 100,000+ Concurrency)
spring.threads.virtual.enabled=true

# 2. High-Performance Embedded Tomcat Server Settings
server.tomcat.max-connections=20000
server.tomcat.accept-count=2000
server.tomcat.threads.max=1000
server.tomcat.threads.min-spare=50
server.tomcat.connection-timeout=30000
server.tomcat.max-keep-alive-requests=500

# 3. HTTP Response GZIP Compression (Reduces payload sizes by 70-80%)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/javascript,text/html,text/xml,text/plain,text/css,application/x-javascript

# 4. Local Database & High-Throughput HikariCP Connection Pool
spring.datasource.url=jdbc:h2:mem:studyloopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# 5. H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 6. JPA / Hibernate High-Throughput Batching & Dialect Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# 7. JWT Secret & Expiration Configuration
app.jwt.secret=studyloop_super_secret_secure_key_for_jwt_tokens_2026_spring_boot_3_peer_learning
app.jwt.expiration-ms=86400000

# 8. Optimized Logging
logging.level.com.studyloop=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.web=INFO
